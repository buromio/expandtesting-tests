[pytest]
addopts =
    --browser chromium
    # --browser firefox
    # --browser webkit
    --headed
    --tracing retain-on-failure
    --screenshot only-on-failure
base_url = https://practice.expandtesting.com
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: critical path tests
    ui: browser UI tests
    api: API tests
    auth: authorization tests
    form: web form/input tests
    positive: positive-path tests
    negative: negative-path tests
    crud: create/read/update/delete flow tests
    schema: tests with JSON Schema response validation
    mobile: tests that run with mobile viewport
